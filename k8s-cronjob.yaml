apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-import-config
  namespace: apps
data:
  PAPERLESS_API_URL: "https://paperless.example.com/api"
  WATCH_DIR: "/mnt/documents"
  IGNORED_PATHS: "/mnt/"
  IGNORED_FOLDERS: "#recycle,@eaDir"
  IGNORED_EXTENSIONS: ".url,.pkpass,.xlsx,.xls,.html,.htm,.ini,.lnk,.exe,.msi,.bat,.cmd,.doc,.docx"
  LOG_RETENTION_DAYS: "30"
---
# ServiceAccount for Vault authentication
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperless-import
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paperless-import
  namespace: apps
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paperless-import
  namespace: apps
subjects:
- kind: ServiceAccount
  name: paperless-import
  namespace: apps
roleRef:
  kind: Role
  name: paperless-import
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-import
  namespace: apps
spec:
  # Run every day at 7 AM
  schedule: "0 7 * * *"
  
  # Keep last 3 successful and 1 failed job
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  
  # Prevent concurrent executions
  concurrencyPolicy: Forbid
  
  jobTemplate:
    spec:
      # If job takes longer than 30 minutes, consider it failed
      activeDeadlineSeconds: 1800
      
      # Don't retry failed jobs - let the next cron execution handle it
      backoffLimit: 0
      
      template:
        metadata:
          labels:
            app: paperless-import
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/role: "paperless-import"
            vault.hashicorp.com/agent-inject-secret-env: "scripts-kv/paperless-ngx"
            vault.hashicorp.com/agent-inject-template-env: |
              {{ with secret "scripts-kv/paperless-ngx" }}
              {{ range $k, $v := .Data.data }}
              export {{ $k }}="{{ $v }}"
              {{ end }}
              {{ end }}
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/tls-skip-verify: "true"
        spec:
          restartPolicy: Never
          serviceAccountName: paperless-import  # Use the SA configured with Kubernetes Auth
          
          # Security context - match NFS ownership (chef user: 1036, users group: 100)
          securityContext:
            runAsNonRoot: true
            runAsUser: 1036
            runAsGroup: 100
            fsGroup: 100
          
          containers:
          - name: paperless-import
            image: registry.example.com/import-paperless-ngx/paperless-import:latest
            
            # Source Vault injected secrets and run the import script
            command:
              - /bin/sh
              - -c
              - |
                set -e
                
                # Source Vault injected secrets
                source /vault/secrets/env
                
                # Export the API token for the Python script
                export PAPERLESS_API_TOKEN="${syno_import_api}"
                
                # Run the import script
                python /app/import_to_paperless.py
            
            # Resource limits
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
            
            # Environment from ConfigMap only (secrets come from Vault)
            envFrom:
            - configMapRef:
                name: paperless-import-config
            
            volumeMounts:
            # NFS mount for documents
            - name: documents-volume
              mountPath: /mnt/documents
              readOnly: true
            
            # Optional: Persistent logs
            - name: logs-volume
              mountPath: /app/logs
          
          volumes:
          # NFS volume for documents
          - name: documents-volume
            nfs:
              server: nfs.example.com
              path: /volume1/factures/
              readOnly: true
          
          # Persistent volume for logs
          - name: logs-volume
            persistentVolumeClaim:
              claimName: paperless-import-logs-pvc
---
# Persistent Volume for logs
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-import-logs-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""  # Static PV, no dynamic provisioning
  nfs:
    server: nfs.example.com
    path: /volume2/docker/paperless-ngx/import/logs
---
# PVC for persistent logs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-import-logs-pvc
  namespace: apps
spec:
  accessModes:
    - ReadWriteMany
  volumeName: paperless-import-logs-pv   # Explicitly target PV
  storageClassName: ""                   # No storage class
  resources:
    requests:
      storage: 1Gi
