name: Build and Push Docker Image to Harbor

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Least privilege by default; the reusable workflow requests what it needs.
permissions:
  contents: read

jobs:
  docker-build-push-scan:
    uses: vchatela-org/shared-workflows/.github/workflows/docker-build-push-harbor.yml@main
    with:
      harbor_registry: ${{ vars.HARBOR_REGISTRY }}
      harbor_project: ${{ vars.HARBOR_PROJECT }}
      harbor_image: ${{ vars.HARBOR_IMAGE }}
      # runs_on: arc-runner-set          # default
      # scan_enabled: true               # default
      # max_critical_vulns: 0            # default
      # max_high_vulns: 5                # default
    secrets:
      harbor_username: ${{ secrets.HARBOR_USERNAME }}
      harbor_password: ${{ secrets.HARBOR_PASSWORD }}
