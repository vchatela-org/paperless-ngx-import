name: 🏷️ Release

# release-please keeps one release PR open with the next version and its CHANGELOG.md
# entry, built from the conventional commits merged since the last release. Merging
# that PR is the release: it tags vX.Y.Z, publishes the GitHub Release, and starts the
# image builds on the tag (a tag made by GITHUB_TOKEN starts no workflow by itself).
# See vchatela-org/shared-workflows, release-please.yml.

on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release:
    # Pinned like the Harbor caller; Dependabot moves the pin.
    uses: vchatela-org/shared-workflows/.github/workflows/release-please.yml@f2a7a2655ba8a97678d2264a83902fdb5851c79a # v1.1.0
    with:
      # tests.yml too, so each release tag has its own test run.
      build_workflows: docker-build-push.yml tests.yml
