name: Security Scan

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]
  schedule:
    # Daily, so newly disclosed CVEs in the pinned base image surface without a
    # commit to trigger them.
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Only granted where the SARIF upload can actually run (see the step
      # condition); fork PRs get a read-only token and report inline instead.
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: paperless-ngx-import:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: paperless-ngx-import:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Upload SARIF to code scanning
        # Fork PRs get a read-only token and cannot upload; they rely on the
        # gating step below instead.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Separate gating pass: the SARIF run above never fails the job, so alerts
      # are always recorded before we decide whether to block.
      - name: Fail on unfixed-excluded CRITICAL/HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: paperless-ngx-import:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
