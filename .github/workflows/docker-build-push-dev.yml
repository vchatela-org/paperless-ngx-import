name: Build and Push Docker Image to Harbor (dev)

on:
  push:
    branches: [ 'main' ]

jobs:
  build-and-push-dev:
    runs-on: arc-runner-set
    env:
      HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
      HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
      HARBOR_IMAGE: ${{ vars.HARBOR_IMAGE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: kubernetes
          driver-opts: |
            namespace=buildkit
            replicas=1
            rootless=true

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image (dev tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.HARBOR_IMAGE }}:dev
        id: build

      - name: Verify image exists in Harbor
        run: |
          echo "Verifying image exists in Harbor registry..."
          
          # URL encode the repository name for Harbor API
          ENCODED_REPO_NAME=$(echo "${{ env.HARBOR_IMAGE }}" | sed 's|/|%2F|g')
          
          # Clean Harbor registry URL (remove protocol if present, and trailing slash)
          HARBOR_HOST="${{ env.HARBOR_REGISTRY }}"
          HARBOR_HOST=$(echo "$HARBOR_HOST" | sed 's|^https://||' | sed 's|^http://||' | sed 's|/$||')
          
          # Construct the API URL
          API_URL="https://${HARBOR_HOST}/api/v2.0/projects/${{ env.HARBOR_PROJECT }}/repositories/${ENCODED_REPO_NAME}/artifacts/dev"
          
          echo "Debug: API URL = $API_URL"
          echo "Debug: Repository name (encoded) = $ENCODED_REPO_NAME"
          
          # Check if the artifact exists via Harbor API
          response=$(curl -s -w "%{http_code}" \
            -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
            "$API_URL" \
            -o /tmp/artifact_response.json)
          
          echo "Debug: HTTP response code = $response"
          echo "Debug: Response body:"
          cat /tmp/artifact_response.json
          
          if [ "$response" = "200" ]; then
            echo "✅ Image successfully pushed and available in Harbor"
            # Display image details
            echo "Image details:"
            jq -r '"  Digest: " + .digest' /tmp/artifact_response.json 2>/dev/null || echo "  Digest: N/A"
            jq -r '"  Size: " + (.size | tostring) + " bytes"' /tmp/artifact_response.json 2>/dev/null || echo "  Size: N/A"
            jq -r '"  Push time: " + .push_time' /tmp/artifact_response.json 2>/dev/null || echo "  Push time: N/A"
          else
            echo "❌ Image not found in Harbor registry"
            echo "HTTP response code: $response"
            exit 1
          fi

      - name: Trigger Harbor vulnerability scan
        run: |
          echo "Triggering vulnerability scan..."
          
          # URL encode the repository name for Harbor API
          ENCODED_REPO_NAME=$(echo "${{ env.HARBOR_IMAGE }}" | sed 's|/|%2F|g')
          
          # Clean Harbor registry URL (remove protocol if present, and trailing slash)
          HARBOR_HOST="${{ env.HARBOR_REGISTRY }}"
          HARBOR_HOST=$(echo "$HARBOR_HOST" | sed 's|^https://||' | sed 's|^http://||' | sed 's|/$||')
          
          # Construct the scan API URL
          SCAN_API_URL="https://${HARBOR_HOST}/api/v2.0/projects/${{ env.HARBOR_PROJECT }}/repositories/${ENCODED_REPO_NAME}/artifacts/dev/scan"
          
          echo "Debug: Scan API URL = $SCAN_API_URL"
          
          response_code=$(curl -s -w "%{http_code}" -o /tmp/scan_response.json \
            -X POST \
            -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
            -H "Content-Type: application/json" \
            "$SCAN_API_URL")
          
          echo "Debug: Scan HTTP response code = $response_code"
          echo "Debug: Scan response body:"
          cat /tmp/scan_response.json
          
          if [ "$response_code" = "202" ]; then
            echo "✅ Vulnerability scan triggered successfully"
          elif [ "$response_code" = "409" ]; then
            echo "⚠️ Scan already in progress or recently completed"
          elif [ "$response_code" = "401" ]; then
            echo "⚠️ Unauthorized to trigger scan - user may not have scan permissions"
            echo "ℹ️ Image was successfully pushed to Harbor, scan will be handled manually if needed"
            # Set a variable to skip the waiting step
            echo "SCAN_SKIPPED=true" >> $GITHUB_ENV
          else
            echo "⚠️ Scan trigger returned HTTP $response_code"
          fi

      - name: Wait for scan completion
        run: |
          # Skip if scanning was not authorized
          if [ "$SCAN_SKIPPED" = "true" ]; then
            echo "ℹ️ Skipping scan wait - scan trigger was unauthorized"
            echo "✅ Workflow completed successfully (image pushed, scan skipped)"
            exit 0
          fi
          
          echo "Waiting for vulnerability scan to complete..."
          max_attempts=30
          attempt=0
          
          # URL encode the repository name for Harbor API
          ENCODED_REPO_NAME=$(echo "${{ env.HARBOR_IMAGE }}" | sed 's|/|%2F|g')
          
          # Clean Harbor registry URL (remove protocol if present, and trailing slash)
          HARBOR_HOST="${{ env.HARBOR_REGISTRY }}"
          HARBOR_HOST=$(echo "$HARBOR_HOST" | sed 's|^https://||' | sed 's|^http://||' | sed 's|/$||')
          
          # Construct the artifacts API URL
          ARTIFACTS_API_URL="https://${HARBOR_HOST}/api/v2.0/projects/${{ env.HARBOR_PROJECT }}/repositories/${ENCODED_REPO_NAME}/artifacts/dev"
          
          while [ $attempt -lt $max_attempts ]; do
            scan_data=$(curl -s \
              -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
              "$ARTIFACTS_API_URL")
            
            # Debug: show the raw scan data structure
            echo "Debug: Raw scan data:"
            echo "$scan_data" | jq -r '.scan_overview // "No scan_overview found"' || echo "No valid JSON in scan_data"
            
            # Fix jq syntax for complex property names
            scan_status=$(echo "$scan_data" | jq -r '.scan_overview["application/vnd.security.vulnerability.report; version=1.1"].scan_status // "Not Available"' 2>/dev/null)
            
            # If that fails, try alternative paths
            if [ "$scan_status" = "Not Available" ] || [ -z "$scan_status" ]; then
              scan_status=$(echo "$scan_data" | jq -r '.scan_overview | to_entries[] | select(.key | contains("vulnerability")) | .value.scan_status // "Not Available"' 2>/dev/null)
            fi
            
            echo "Scan status: $scan_status (attempt $((attempt + 1))/$max_attempts)"
            
            if [ "$scan_status" = "Success" ]; then
              echo "✅ Scan completed successfully"
              break
            elif [ "$scan_status" = "Error" ]; then
              echo "❌ Scan completed with errors"
              break
            elif [ "$scan_status" = "Stopped" ]; then
              echo "⚠️ Scan was stopped"
              break
            fi
            
            sleep 10
            attempt=$((attempt + 1))
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "⚠️ Scan did not complete within timeout (5 minutes)"
            echo "Current status: $scan_status"
            echo "ℹ️ Image was successfully pushed to Harbor, scan timeout is not critical"
            echo "SCAN_INCOMPLETE=true" >> $GITHUB_ENV
            # Don't exit with error - main workflow goal (build/push) succeeded
          fi

      - name: Get vulnerability scan results
        id: scan_results
        run: |
          # Skip if scanning was skipped or incomplete
          if [ "$SCAN_SKIPPED" = "true" ] || [ "$SCAN_INCOMPLETE" = "true" ]; then
            echo "ℹ️ Skipping scan results - scan was not completed"
            echo "scan_status=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Retrieving vulnerability scan results..."
          
          # URL encode the repository name for Harbor API
          ENCODED_REPO_NAME=$(echo "${{ env.HARBOR_IMAGE }}" | sed 's|/|%2F|g')
          
          # Clean Harbor registry URL (remove protocol if present, and trailing slash)
          HARBOR_HOST="${{ env.HARBOR_REGISTRY }}"
          HARBOR_HOST=$(echo "$HARBOR_HOST" | sed 's|^https://||' | sed 's|^http://||' | sed 's|/$||')
          
          # Construct the artifacts API URL
          ARTIFACTS_API_URL="https://${HARBOR_HOST}/api/v2.0/projects/${{ env.HARBOR_PROJECT }}/repositories/${ENCODED_REPO_NAME}/artifacts/dev"
          
          # Get scan results
          scan_data=$(curl -s \
            -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
            "$ARTIFACTS_API_URL")
          
          # Check if scan data exists
          scan_overview=$(echo "$scan_data" | jq -r '.scan_overview.["application/vnd.security.vulnerability.report; version=1.1"] // null')
          
          if [ "$scan_overview" = "null" ]; then
            echo "⚠️ No vulnerability scan data available"
            echo "critical=0" >> $GITHUB_OUTPUT
            echo "high=0" >> $GITHUB_OUTPUT
            echo "medium=0" >> $GITHUB_OUTPUT
            echo "low=0" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
            echo "scan_status=No Data" >> $GITHUB_OUTPUT
          else
            # Extract vulnerability counts
            critical=$(echo "$scan_data" | jq -r '.scan_overview.["application/vnd.security.vulnerability.report; version=1.1"].summary.critical // 0')
            high=$(echo "$scan_data" | jq -r '.scan_overview.["application/vnd.security.vulnerability.report; version=1.1"].summary.high // 0')
            medium=$(echo "$scan_data" | jq -r '.scan_overview.["application/vnd.security.vulnerability.report; version=1.1"].summary.medium // 0')
            low=$(echo "$scan_data" | jq -r '.scan_overview.["application/vnd.security.vulnerability.report; version=1.1"].summary.low // 0')
            total=$(echo "$scan_data" | jq -r '.scan_overview.["application/vnd.security.vulnerability.report; version=1.1"].summary.total // 0')
            scan_status=$(echo "$scan_data" | jq -r '.scan_overview.["application/vnd.security.vulnerability.report; version=1.1"].scan_status // "Unknown"')
            
            # Output results
            echo "critical=$critical" >> $GITHUB_OUTPUT
            echo "high=$high" >> $GITHUB_OUTPUT
            echo "medium=$medium" >> $GITHUB_OUTPUT
            echo "low=$low" >> $GITHUB_OUTPUT
            echo "total=$total" >> $GITHUB_OUTPUT
            echo "scan_status=$scan_status" >> $GITHUB_OUTPUT
          fi
          
          # Create summary
          echo "## 🛡️ Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.HARBOR_IMAGE }}:dev\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | ${critical:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | ${high:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Medium | ${medium:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 Low | ${low:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **${total:-0}** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Status:** ${scan_status:-Unknown}" >> $GITHUB_STEP_SUMMARY

      - name: Check vulnerability thresholds
        run: |
          echo "Checking vulnerability thresholds..."
          
          critical=${{ steps.scan_results.outputs.critical }}
          high=${{ steps.scan_results.outputs.high }}
          scan_status="${{ steps.scan_results.outputs.scan_status }}"
          
          # Skip if scanning was skipped
          if [ "$scan_status" = "skipped" ]; then
            echo "ℹ️ Skipping vulnerability threshold check - scan was not completed"
            echo "✅ Workflow completed successfully (image pushed, scan skipped)"
            exit 0
          fi
          
          # Define your acceptable thresholds here
          max_critical=0
          max_high=5
          
          echo "Critical vulnerabilities: $critical (threshold: $max_critical)"
          echo "High vulnerabilities: $high (threshold: $max_high)"
          echo "Scan status: $scan_status"
          
          # Only check thresholds if scan was successful
          if [ "$scan_status" = "Success" ]; then
            if [ "$critical" -gt "$max_critical" ]; then
              echo "❌ FAIL: Critical vulnerabilities ($critical) exceed threshold ($max_critical)"
              exit 1
            fi
            
            if [ "$high" -gt "$max_high" ]; then
              echo "❌ FAIL: High vulnerabilities ($high) exceed threshold ($max_high)"
              exit 1
            fi
            
            echo "✅ PASS: Vulnerability levels are within acceptable thresholds"
          else
            echo "⚠️ WARNING: Scan status is '$scan_status' - skipping threshold checks"
          fi

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up temporary files..."
          rm -f /tmp/artifact_response.json /tmp/scan_response.json skopeo
          echo "✅ Cleanup completed"

