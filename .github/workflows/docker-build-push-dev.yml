name: Build and Push Docker Image to Harbor (dev)

on:
  push:
    branches: [ 'main' ]

jobs:
  build-and-push-dev:
    runs-on: arc-runner-set

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: kubernetes
          driver-opts: |
            namespace=buildkit
            replicas=1
            rootless=true

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image (dev tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${{ secrets.HARBOR_IMAGE }}:dev
        id: build

      - name: Verify image pull
        run: |
          echo "Verifying image can be pulled..."
          docker pull ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${{ secrets.HARBOR_IMAGE }}:dev
          echo "✅ Image pull successful"

      - name: Trigger Harbor vulnerability scan
        run: |
          echo "Triggering vulnerability scan..."
          curl -X POST \
            -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.HARBOR_REGISTRY }}/api/v2.0/projects/${{ secrets.HARBOR_PROJECT }}/repositories/${{ secrets.HARBOR_IMAGE }}/artifacts/dev/scan" \
            || echo "⚠️ Scan trigger failed or already in progress"

      - name: Wait for scan completion
        run: |
          echo "Waiting for vulnerability scan to complete..."
          max_attempts=30
          attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            scan_status=$(curl -s \
              -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
              "${{ secrets.HARBOR_REGISTRY }}/api/v2.0/projects/${{ secrets.HARBOR_PROJECT }}/repositories/${{ secrets.HARBOR_IMAGE }}/artifacts/dev" \
              | jq -r '.scan_overview.["application/vnd.security.vulnerability.report; version=1.1"].scan_status // "Not Available"')
            
            echo "Scan status: $scan_status (attempt $((attempt + 1))/$max_attempts)"
            
            if [ "$scan_status" = "Success" ] || [ "$scan_status" = "Error" ]; then
              break
            fi
            
            sleep 10
            attempt=$((attempt + 1))
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "⚠️ Scan did not complete within timeout"
            exit 1
          fi

      - name: Get vulnerability scan results
        id: scan_results
        run: |
          echo "Retrieving vulnerability scan results..."
          
          # Get scan results
          scan_data=$(curl -s \
            -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
            "${{ secrets.HARBOR_REGISTRY }}/api/v2.0/projects/${{ secrets.HARBOR_PROJECT }}/repositories/${{ secrets.HARBOR_IMAGE }}/artifacts/dev")
          
          # Extract vulnerability counts
          critical=$(echo "$scan_data" | jq -r '.scan_overview.["application/vnd.security.vulnerability.report; version=1.1"].summary.critical // 0')
          high=$(echo "$scan_data" | jq -r '.scan_overview.["application/vnd.security.vulnerability.report; version=1.1"].summary.high // 0')
          medium=$(echo "$scan_data" | jq -r '.scan_overview.["application/vnd.security.vulnerability.report; version=1.1"].summary.medium // 0')
          low=$(echo "$scan_data" | jq -r '.scan_overview.["application/vnd.security.vulnerability.report; version=1.1"].summary.low // 0')
          total=$(echo "$scan_data" | jq -r '.scan_overview.["application/vnd.security.vulnerability.report; version=1.1"].summary.total // 0')
          scan_status=$(echo "$scan_data" | jq -r '.scan_overview.["application/vnd.security.vulnerability.report; version=1.1"].scan_status // "Unknown"')
          
          # Output results
          echo "critical=$critical" >> $GITHUB_OUTPUT
          echo "high=$high" >> $GITHUB_OUTPUT
          echo "medium=$medium" >> $GITHUB_OUTPUT
          echo "low=$low" >> $GITHUB_OUTPUT
          echo "total=$total" >> $GITHUB_OUTPUT
          echo "scan_status=$scan_status" >> $GITHUB_OUTPUT
          
          # Create summary
          echo "## 🛡️ Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${{ secrets.HARBOR_IMAGE }}:dev\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | $critical |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | $high |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Medium | $medium |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 Low | $low |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **$total** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Status:** $scan_status" >> $GITHUB_STEP_SUMMARY

      - name: Check vulnerability thresholds
        run: |
          echo "Checking vulnerability thresholds..."
          
          critical=${{ steps.scan_results.outputs.critical }}
          high=${{ steps.scan_results.outputs.high }}
          
          # Define your acceptable thresholds here
          max_critical=0
          max_high=5
          
          echo "Critical vulnerabilities: $critical (threshold: $max_critical)"
          echo "High vulnerabilities: $high (threshold: $max_high)"
          
          if [ "$critical" -gt "$max_critical" ]; then
            echo "❌ FAIL: Critical vulnerabilities ($critical) exceed threshold ($max_critical)"
            exit 1
          fi
          
          if [ "$high" -gt "$max_high" ]; then
            echo "❌ FAIL: High vulnerabilities ($high) exceed threshold ($max_high)"
            exit 1
          fi
          
          echo "✅ PASS: Vulnerability levels are within acceptable thresholds"

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up local images..."
          docker rmi ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${{ secrets.HARBOR_IMAGE }}:dev || true

