version: 2

updates:
  # Python dependencies. requirements.txt is hash-pinned, so Dependabot
  # regenerates the hashes along with the version bump.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  # Base image. The Dockerfile pins tag + digest; Dependabot updates both.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    # Stay on the current Python minor line. Left unconstrained, Dependabot
    # offers release candidates (it proposed 3.15.0rc1-alpine while 3.14.7 was
    # still the newest stable), which trades a supported runtime for an
    # untested one without fixing any CVE. Dependabot's `versions` field takes
    # Bundler ranges rather than globs for the docker ecosystem, so there is no
    # way to say "stable only" -- blocking minors is the only lever available.
    #
    # The cost is that Dependabot goes quiet when the next minor ships for
    # real (3.15.0 final is due 2026-10-01 per PEP 790). The base-image-freshness
    # job in security-scan.yml covers that gap: it runs daily and fails once a
    # newer *stable* tag exists, which is the cue to bump tag + digest by hand.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # Actions used by the workflows in this repo.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
