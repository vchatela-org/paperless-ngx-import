version: 2

updates:
  # Python dependencies. requirements.txt is hash-pinned, so Dependabot
  # regenerates the hashes along with the version bump.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  # Base image. The Dockerfile pins tag + digest; Dependabot updates both.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    # Stay on the current Python minor line. Left unconstrained, Dependabot
    # offers release candidates (it proposed 3.15.0rc1-alpine while 3.14.7 was
    # still the newest stable), which trades a supported runtime for an
    # untested one without fixing any CVE. Patch releases inside the line carry
    # the security fixes; moving to the next minor is a deliberate, manual bump.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # Actions used by the workflows in this repo.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
